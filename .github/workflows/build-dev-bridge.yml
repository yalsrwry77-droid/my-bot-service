name: Build dev-bridge APK

on:
  push:
    paths:
      - 'dev-bridge/**'
      - '.github/workflows/build-dev-bridge.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
      - name: Ensure Gradle wrapper
        working-directory: dev-bridge
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7 --no-daemon
          fi
      - name: Build debug APK
        working-directory: dev-bridge
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dev-bridge-debug
          path: dev-bridge/app/build/outputs/apk/debug/*.apk
